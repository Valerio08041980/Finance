<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Portfolio Definitivo</title>

<style>
body {
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial;
}

.header {
  text-align:center;
  padding:25px;
  background:#1a1a1a;
}

.grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:20px;
}

.card {
  background:#1f1f1f;
  margin:10px;
  padding:20px;
  border-radius:12px;
  width:280px;
  text-align:center;
}

.big {
  font-size:28px;
  margin-top:10px;
}

.green { color:#00e676; }
.red { color:#ff5252; }
.gray { color:#aaa; }
</style>
</head>

<body>

<div class="header">
  <h1>📊 Portfolio Investimenti</h1>
  <p>Dashboard automatica live</p>
</div>

<div class="grid">

  <div class="card">
    <h2>🍎 Apple</h2>
    <div id="applePrice" class="big">--</div>
    <div id="appleProfit">--</div>
    <div id="applePercent">--</div>
  </div>

  <div class="card">
    <h2>🪙 Oro</h2>
    <div class="gray">Da collegare (XAU/EUR)</div>
  </div>

  <div class="card">
    <h2>🏦 BTP</h2>
    <div class="gray">Da collegare</div>
  </div>

  <div class="card">
    <h2>💰 Totale Portfolio</h2>
    <div class="gray">Apple + altri asset</div>
  </div>

</div>

<script>

const appleQty = 70;
const appleBuy = 225;

async function update() {

  try {

    // Apple USD
    const res = await fetch("https://query1.finance.yahoo.com/v7/finance/quote?symbols=AAPL");
    const data = await res.json();

    const usd = data.quoteResponse.result[0].regularMarketPrice;

    // USD → EUR
    const fx = await fetch("https://api.exchangerate.host/latest?base=USD&symbols=EUR");
    const fxData = await fx.json();

    const eur = usd * fxData.rates.EUR;

    // calcoli Apple
    const invested = appleBuy * appleQty;
    const current = eur * appleQty;
    const profit = current - invested;
    const percent = (profit / invested) * 100;

    // output Apple
    document.getElementById("applePrice").innerText =
      eur.toFixed(2) + " €";

    const p = document.getElementById("appleProfit");
    p.innerText = "Profitto: " + profit.toFixed(2) + " €";
    p.className = profit >= 0 ? "green" : "red";

    const pr = document.getElementById("applePercent");
    pr.innerText = "Performance: " + percent.toFixed(2) + " %";
    pr.className = percent >= 0 ? "green" : "red";

  } catch (e) {
    document.getElementById("applePrice").innerText = "Errore dati";
  }
}

update();
setInterval(update, 60000);

</script>

</body>
</html>
