<script>

const qty = 70;
const buy = 225;

async function load() {

  try {

    // 🍎 Apple via proxy CORS (FUNZIONA SU GITHUB PAGES)
    const res = await fetch(
      "https://api.allorigins.win/raw?url=" +
      encodeURIComponent("https://query1.finance.yahoo.com/v7/finance/quote?symbols=AAPL")
    );

    const data = await res.json();

    const usd = data.quoteResponse.result[0].regularMarketPrice;

    // cambio EUR
    const fx = await fetch("https://api.exchangerate.host/latest?base=USD&symbols=EUR");
    const fxData = await fx.json();

    const eur = usd * fxData.rates.EUR;

    document.getElementById("applePrice").innerText =
      eur.toFixed(2) + " €";

  } catch (e) {
    document.getElementById("applePrice").innerText =
      "Errore dati";
  }
}

load();
setInterval(load, 60000);

</script>
